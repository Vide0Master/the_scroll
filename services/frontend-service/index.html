<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>The Scroll</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
		/>
		<script>
			// Apply the cached theme before first paint. Same validation as readThemeCache().
			try {
				var cached = JSON.parse(localStorage.getItem('scroll.theme'));
				if (cached && cached.v === 1 && Array.isArray(cached.vars)) {
					for (var i = 0; i < cached.vars.length; i++) {
						var entry = cached.vars[i];
						if (
							/^--theme-[a-z-]+$/.test(entry[0]) &&
							/^#[0-9a-fA-F]{6}$/.test(entry[1])
						) {
							document.documentElement.style.setProperty(entry[0], entry[1]);
						}
					}
				}
			} catch (error) {
				/* no cached theme: the CSS fallback (dark) stays */
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script
			type="module"
			src="/src/main.tsx"
		></script>
	</body>
</html>
